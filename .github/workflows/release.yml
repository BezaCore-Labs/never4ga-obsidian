# Builds the plugin and publishes it as a GitHub release.
#
# Pushing a tag that is exactly a version, such as `0.2.0`, releases that
# version. Obsidian and BRAT both find a release by a tag equal to the version
# in `manifest.json`, with no `v` prefix, so the tag pattern and the check
# below hold to that.
#
# The release carries the three files Obsidian installs from a plugin's
# folder: `main.js`, `manifest.json` and `styles.css`. It is created with the
# workflow's own GITHUB_TOKEN; nothing else is stored or needed.

name: release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

# Creating a release is a write to the repository, and the only one this
# workflow makes.
permissions:
  contents: write

# Two tags pushed together would race to create their releases. One at a
# time, and never cancelled part way through.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      # A release tag must name the version the manifest says it is, or
      # Obsidian would install a release whose manifest disagrees with its tag.
      - name: Check the tag against the manifest
        run: |
          version=$(node -p 'require("./manifest.json").version')
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest.json version $version" >&2
            exit 1
          fi

      # Typecheck, unit tests, production build: the same gate every pull
      # request passes, and the build that produces the main.js released.
      - name: Gate
        run: npm run gate

      # Attach only what the build actually produced. main.js and
      # manifest.json are required; styles.css is attached when the plugin
      # has one.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=()
          for file in main.js manifest.json styles.css; do
            if [ -f "$file" ]; then
              files+=("$file")
            elif [ "$file" != styles.css ]; then
              echo "::error::$file is missing after the build" >&2
              exit 1
            fi
          done
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
